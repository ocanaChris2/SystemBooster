[package]
name = "booster-service"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Privileged LocalSystem host that owns the boost engine and serves the UI over a named pipe."

[[bin]]
name = "booster-service"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
booster-core = { workspace = true }
booster-ipc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
] }
