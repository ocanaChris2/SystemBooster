[package]
name = "booster-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Privilege-agnostic engine: scan, classify, suspend, and restore Windows processes/services."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }

# Win32 bindings are only pulled in (and only linked) when targeting Windows.
# On other platforms the crate compiles using the mock backend so the engine
# logic (classification, restore-session bookkeeping) stays unit-testable.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Services",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
] }
