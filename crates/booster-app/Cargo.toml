[package]
name = "booster-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "SystemBooster desktop UI (Tauri). Proxies user actions to the privileged service over the named pipe."

# This crate is excluded from the root workspace (see root Cargo.toml): its
# backend depends on system libraries (webkit2gtk on Linux) not present in CI.
# Build it on a developer machine with the Tauri prerequisites installed.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
booster-core = { path = "../booster-core" }
booster-ipc = { path = "../booster-ipc" }

[features]
custom-protocol = ["tauri/custom-protocol"]
